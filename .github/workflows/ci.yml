name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Catalog (strict)
        run: npm run catalog:validate -- --strict
      - name: Generated files are up to date
        run: |
          npm run catalog:schema -- --check
          npm run catalog:docs -- --check
      - name: Build
        run: npm run build
